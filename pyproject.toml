[project]
name = "upstream-dlk"
version = "0.1.0"
description = "Local bronze/silver/gold DataLake for Upstream vehicle messages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fsspec>=2026.9.0",
    "httpx>=0.28.1",
    "polars>=2.1.0",
    "prefect>=3.9.4",
]

[project.optional-dependencies]
s3 = [
    "s3fs>=2026.9.0",
]

[project.scripts]
dlk = "upstream_dlk.flows:main"
dlk-sqli = "upstream_dlk.flows:sql_injection_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "trino>=0.340.0",
]
